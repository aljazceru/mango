[package]
name = "mango-desktop"
version = "0.3.0"
edition = "2021"
publish = false
description = "Desktop UI for Mango (iced)"
license.workspace = true
repository.workspace = true

[dependencies]
mango_core = { path = "../../rust" }
iced = { version = "0.14", features = ["tokio", "markdown", "highlighter", "lazy", "image-without-codecs"] }
flume = "0.12"
rfd = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
