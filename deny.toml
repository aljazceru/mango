[advisories]
ignore = [
    # Unmaintained transitive deps with no safe upgrade — revisit periodically
    "RUSTSEC-2025-0012",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0320",
    # rand 0.8.5 unsoundness — transitive dep pinned by upstream, needs >=0.9.3
    "RUSTSEC-2026-0097",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "sentry" },
    { crate = "sentry-core" },
    { crate = "amplitude" },
    { crate = "datadog" },
    { crate = "newrelic" },
    { crate = "mixpanel" },
    { crate = "segment" },
    { crate = "rudderstack" },
    { crate = "posthog" },
    { crate = "opentelemetry" },
    { crate = "tracing-opentelemetry" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "AGPL-3.0-only",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
