[advisories]
ignore = [
    # Unmaintained transitive deps with no safe upgrade — revisit periodically
    "RUSTSEC-2025-0012",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0320",
    # Informational unmaintained notice. contextvm-sdk 0.2.2 pins nostr-sdk 0.44;
    # the 0.44.3 relay-pool security fixes are applied. Remove when ContextVM
    # supports nostr-sdk >=0.45, which incorporates the pool.
    "RUSTSEC-2026-0243",
    # Informational unmaintained notice with no safe upgrade. This is transitive
    # through Iced's font stack and pdf-extract; migrate when either upstream
    # adopts skrifa or another maintained font parser.
    "RUSTSEC-2026-0192",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "sentry" },
    { crate = "sentry-core" },
    { crate = "amplitude" },
    { crate = "datadog" },
    { crate = "newrelic" },
    { crate = "mixpanel" },
    { crate = "segment" },
    { crate = "rudderstack" },
    { crate = "posthog" },
    { crate = "opentelemetry" },
    { crate = "tracing-opentelemetry" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "NCSA",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "AGPL-3.0-only",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
