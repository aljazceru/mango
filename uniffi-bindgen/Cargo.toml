publish = false
description = "UniFFI binding generator for mango_core"
license.workspace = true
repository.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
