name: Mango
options:
  bundleIdPrefix: dev.disobey.mango
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    exactVersion: "0.3.1"
  HighlightSwift:
    url: https://github.com/appstefan/highlightswift.git
    from: "1.1.0"
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  LlamaSwift:
    url: https://github.com/mattt/llama.swift.git
    exactVersion: "2.9771.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.disobey.mango
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 3
    SWIFT_VERSION: 5.9
  configs:
    Debug:
      PRODUCT_BUNDLE_IDENTIFIER: dev.disobey.mango.dev

targets:
  Mango:
    type: application
    platform: iOS
    sources:
      - path: Mango
        excludes:
          - "Resources/**"
      - path: Mango/Resources/model_optimized.onnx
        buildPhase: resources
      - path: Mango/Resources/tokenizer.json
        buildPhase: resources
      - path: ../Bindings
        excludes:
          - "*.h"
          - "*.modulemap"
    settings:
      base:
        INFOPLIST_FILE: Mango/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: ../Frameworks/MangoCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - package: Textual
        product: Textual
      - package: HighlightSwift
        product: HighlightSwift
      - package: onnxruntime
        product: onnxruntime
      - package: LlamaSwift
        product: LlamaSwift
  MangoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MangoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.disobey.mango.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mango
    dependencies:
      - target: Mango

schemes:
  Mango:
    build:
      targets:
        Mango: all
        MangoUITests: [test]
    test:
      targets:
        - MangoUITests
