[package]
name = "mango_core"
version = "0.3.0"
edition = "2021"
description = "Confidential AI inference engine with TEE attestation and local RAG"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Product gate for autonomous agent UI/session orchestration. Keep disabled for
# releases until agents are ready to ship.
agents = []

[dependencies]
flume = "0.11"
uniffi = "0.29"

# Phase 2: Streaming LLM client
async-openai = { version = "0.34", default-features = false, features = ["chat-completion"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Phase 3: Attestation verification
dcap-qvl = "0.5"
sev = { version = "7.1", default-features = false, features = ["snp", "crypto_nossl"] }
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rand = "0.8"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum"] }
sha2 = "0.10"
x509-cert = "0.2"
x509-parser = "0.18"
webpki-roots = "0.26"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
aes-gcm = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }

# Phase 4: Persistence layer
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Debug logging
log = "0.4"
env_logger = "0.11"

usearch = "2.24.0"
pdf-extract = "0.12.0"
once_cell = "1"

# Phase 32-09: directory-sync file format extractors (pure-Rust, no OpenSSL,
# mobile-safe). Versions confirmed via Context7 + crates.io. Audited via
# `cargo tree -p mango_core | grep -iE "openssl-sys|native-tls"` — no new
# OpenSSL / native-tls introduced beyond the pre-existing rusqlite vendored
# baseline.
docx-rs = { version = "0.4.22", default-features = false }
epub-parser = "0.3.4"
html2text = "0.17"
rtf-parser = "0.4.2"

# Phase 22: Agent tools expansion
scraper = "0.26"
evalexpr = "13.1"

# Phase 32: cross-platform glob validation (exposed to mobile UI via UniFFI).
globset = "0.4"

# Phase 33: Venice.ai TEE-attested provider — secp256k1 ECDH + Keccak256 address binding
k256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic", "std"] }
sha3 = { version = "0.10", default-features = false }
urlencoding = "2.1"

# Phase 34: Redpill TEE-attested aggregator — zero new deps; reuses Phase 33 stack
# (dcap-qvl, sha2, sha3, base64, hex, reqwest, serde_json, plus attestation/venice.rs
# model-ecdsa REPORTDATA decoder).

# Phase 35: Nostr-based tool discovery + invocation (pure-Rust, rustls only)
contextvm-sdk = "0.2.1"

# Phase 36: npub bech32 encoding via nostr::nips::nip19::ToBech32 trait.
# Bumped to 0.44 to pick up RUSTSEC-2026-0189 (NIP-44 DoS fix).
nostr = { version = "0.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "linux-native", "windows-native"] }
# Phase 8: Desktop-only embedding stack.
fastembed = { version = "5.13.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

# Phase 32: Directory-based RAG ingestion (desktop only).
# `ignore` powers walk_with_exclusions. globset is exposed on all platforms
# (below) for UI-side glob validation over UniFFI.
ignore = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
# contextvm mock-relay + rmcp server/client fixtures for in-process E2E tests.
contextvm-sdk = { version = "0.2.1", features = ["test-utils", "rmcp"] }
rmcp = { version = "1", features = ["server", "client", "macros", "schemars"] }
schemars = "1"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
