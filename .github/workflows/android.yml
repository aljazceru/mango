name: Android

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NDK_VERSION: "28.2.13676358"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build host Rust (for uniffi-bindgen)
        run: cargo build -p mango_core --release

      - name: Generate Kotlin bindings
        run: |
          cargo run -p uniffi-bindgen -- generate \
            --library target/release/libmango_core.so \
            --language kotlin \
            --out-dir android/app/src/main/java \
            --no-format \
            --config rust/uniffi.toml

      - name: Cross-compile Rust for Android (arm64)
        run: |
          cargo ndk -o android/app/src/main/jniLibs -P 28 \
            -t arm64-v8a \
            build -p mango_core --release

      - name: Bundle libc++_shared.so (required by ONNX Runtime)
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cp "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            android/app/src/main/jniLibs/arm64-v8a/

      - name: Build and bundle llama.cpp Android libraries
        run: |
          source android/llama.cpp.version
          LLAMA_CPP_DIR="$GITHUB_WORKSPACE/../llama.cpp"
          if [[ -d "$LLAMA_CPP_DIR/.git" ]]; then
            git -C "$LLAMA_CPP_DIR" fetch --tags "$LLAMA_CPP_REPO" "$LLAMA_CPP_TAG"
            git -C "$LLAMA_CPP_DIR" checkout "$LLAMA_CPP_COMMIT"
          else
            git clone --branch "$LLAMA_CPP_TAG" "$LLAMA_CPP_REPO" "$LLAMA_CPP_DIR"
            git -C "$LLAMA_CPP_DIR" checkout "$LLAMA_CPP_COMMIT"
          fi
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cmake -S "$LLAMA_CPP_DIR" -B "$LLAMA_CPP_DIR/build-android-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build "$LLAMA_CPP_DIR/build-android-arm64" --config Release --parallel \
            --target ggml-base ggml-cpu ggml llama llama-common
          for lib in libggml-base.so libggml-cpu.so libggml.so libllama.so libllama-common.so; do
            cp "$LLAMA_CPP_DIR/build-android-arm64/bin/$lib" android/app/src/main/jniLibs/arm64-v8a/
          done
          scripts/check_llama_versions.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Rust fmt/clippy/tests (release gate prerequisites)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace

      - name: Gradle unit tests + lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: PPQ orchestration gate (required for MANAGED_PPQ_ENABLED builds)
        run: scripts/check_ppq_gate.sh

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Feature-flag-off regression (default APK must have managed PPQ disabled)
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if grep -qa "MANAGED_PPQ_ENABLED=true" <(unzip -p "$APK" classes.dex 2>/dev/null | strings 2>/dev/null) 2>/dev/null; then
            echo "FAIL: default APK built with managed PPQ enabled"; exit 1
          fi
          echo "OK: default APK has managed PPQ disabled"

      - name: Managed-PPQ variant (only when the Wave 0 gate artifact is approved)
        working-directory: android
        run: |
          if grep -Eq '^status:[[:space:]]*approved' ../docs/integrations/ppq-orchestration-approval.md; then
            ./gradlew assembleRelease -PMANAGED_PPQ_ENABLED=true
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/release/mango-managed-ppq-release.apk
          else
            echo "PPQ gate not approved — managed variant skipped"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mango-android-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
