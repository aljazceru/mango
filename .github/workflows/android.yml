name: Android

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Host-side Rust gates: fmt + clippy + full test suite. Runs in PARALLEL with
  # the android job so the release critical path is max(checks, build), not the
  # sum. Tag pushes gate the release attach on this job.
  # ─────────────────────────────────────────────────────────────────────────────
  checks:
    name: Rust checks (fmt/clippy/tests)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Rust fmt/clippy/tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace

  # ─────────────────────────────────────────────────────────────────────────────
  # Android artifact build: bindings + arm64 cross-compile + llama.cpp + Gradle.
  # PRs produce a debug APK (no secrets); tags produce the signed release APK.
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Android build
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # Tag-only release signing (see docs/release/android-signing.md). Secret
      # values are never printed; Gradle's requireReleaseSigning guard fails
      # the build if any is blank. KEYSTORE_PATH is exported by the
      # provisioning step below via $GITHUB_ENV.
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          # Keep cargo-ndk installed across runs (cargo install skips the
          # rebuild when the cached binary matches the resolved version).
          cache-directories: ~/.cargo/bin

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Debug host build: uniffi-bindgen only reads the FFI checksums from the
      # dylib, and the generated bindings are byte-identical to a release-built
      # library at a fraction of the compile time.
      - name: Build host Rust (for uniffi-bindgen)
        run: cargo build -p mango_core

      # Crate-level rust/uniffi.toml supplies package_name/cdylib_name and
      # `android = true` (Android-cleaner variant — lint-clean on minSdk 28).
      # No --config override: uniffi-bindgen 0.32 ignores old-style flat files.
      - name: Generate Kotlin bindings
        run: |
          cargo run -p uniffi-bindgen -- generate \
            --library target/debug/libmango_core.so \
            --language kotlin \
            --out-dir android/app/src/main/java \
            --no-format

      - name: Cross-compile Rust for Android (arm64)
        run: |
          cargo ndk -o android/app/src/main/jniLibs -P 28 \
            -t arm64-v8a \
            build -p mango_core --release

      - name: Bundle libc++_shared.so (required by ONNX Runtime)
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cp "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            android/app/src/main/jniLibs/arm64-v8a/

      # llama.cpp is pinned by android/llama.cpp.version — the compiled libs
      # only change when that file (or the NDK) does, so cache them instead of
      # rebuilding ~4 minutes of cmake on every run.
      - name: Restore llama.cpp Android libraries
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ~/llama-android-arm64
          key: llama-android-arm64-${{ env.NDK_VERSION }}-${{ hashFiles('android/llama.cpp.version') }}

      - name: Build and bundle llama.cpp Android libraries
        run: |
          set -euo pipefail
          source android/llama.cpp.version
          LLAMA_CPP_DIR="$GITHUB_WORKSPACE/../llama.cpp"
          # The pinned checkout is ALWAYS required: Gradle's CMake wrapper
          # compiles against its headers and verifyLlamaCppInputs checks the
          # git rev. The cache below only skips the ~4-minute cmake build.
          if [[ -d "$LLAMA_CPP_DIR/.git" ]]; then
            git -C "$LLAMA_CPP_DIR" fetch --tags "$LLAMA_CPP_REPO" "$LLAMA_CPP_TAG"
            git -C "$LLAMA_CPP_DIR" checkout "$LLAMA_CPP_COMMIT"
          else
            git clone --branch "$LLAMA_CPP_TAG" "$LLAMA_CPP_REPO" "$LLAMA_CPP_DIR"
            git -C "$LLAMA_CPP_DIR" checkout "$LLAMA_CPP_COMMIT"
          fi
          mkdir -p "$HOME/llama-android-arm64"
          if [[ ! -f "$HOME/llama-android-arm64/libggml.so" ]]; then
            NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
            cmake -S "$LLAMA_CPP_DIR" -B "$LLAMA_CPP_DIR/build-android-arm64" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_TESTS=OFF
            cmake --build "$LLAMA_CPP_DIR/build-android-arm64" --config Release --parallel \
              --target ggml-base ggml-cpu ggml llama llama-common
            cp "$LLAMA_CPP_DIR"/build-android-arm64/bin/libggml-base.so \
               "$LLAMA_CPP_DIR"/build-android-arm64/bin/libggml-cpu.so \
               "$LLAMA_CPP_DIR"/build-android-arm64/bin/libggml.so \
               "$LLAMA_CPP_DIR"/build-android-arm64/bin/libllama.so \
               "$LLAMA_CPP_DIR"/build-android-arm64/bin/libllama-common.so \
               "$HOME/llama-android-arm64/"
          else
            echo "llama.cpp libs restored from cache (key pins the version)"
          fi
          cp "$HOME"/llama-android-arm64/*.so android/app/src/main/jniLibs/arm64-v8a/
          LLAMA_ANDROID_BIN="$HOME/llama-android-arm64" scripts/check_llama_versions.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle unit tests + lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      # ── PR path: debug APK, no signing secrets ──────────────────────────────
      - name: Build debug APK (validation packaging)
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Managed-PPQ presence check (debug APK ships the feature)
        if: github.event_name == 'pull_request'
        run: |
          scripts/check_ppq_packaging.sh present \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mango-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ── Tag path: signed release APK ────────────────────────────────────────
      # Decode the release keystore from the base64 repository secret. The
      # secret flows through env indirection only; it is never echoed, logged,
      # or included in artifacts. Gradle reads the keystore via KEYSTORE_PATH
      # (exported here, pointing outside the checkout workspace).
      - name: Provision release signing material (from repository secrets)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Repository secret ANDROID_KEYSTORE_BASE64 is not set — cannot sign the release. See docs/release/android-signing.md" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/mango-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [[ ! -s "$keystore" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty keystore — check the secret value." >&2
            exit 1
          fi
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: ./gradlew assembleRelease

      # Managed PPQ ships in every build — verify the bytes, then stage the
      # single published APK under an unambiguous name.
      - name: Verify managed-PPQ presence and stage release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/release/app-release.apk"
          dist="app/build/outputs/apk/dist"
          [[ -f "$src" ]] || { echo "::error::release APK missing: $src"; exit 1; }
          mkdir -p "$dist"
          ../scripts/check_ppq_packaging.sh present "$src"
          cp "$src" "$dist/mango-release.apk"

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mango-android-release-${{ github.sha }}
          path: android/app/build/outputs/apk/dist/mango-release.apk
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Attach the signed APK to the tag's GitHub release. The ONLY job with
  # contents:write — gated on both the Rust gates and the signed build.
  # ─────────────────────────────────────────────────────────────────────────────
  attach-release:
    name: Attach APK to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: mango-android-release-${{ github.sha }}
          path: apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/mango-release.apk
