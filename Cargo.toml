[workspace]
members = ["rust", "uniffi-bindgen", "desktop/iced", "tools/contextvm-echo-server"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-only"
repository = "https://github.com/aljazceru/mango"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1
opt-level = "z"
panic = "abort"
